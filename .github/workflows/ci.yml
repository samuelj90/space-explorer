name: CI & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit Tests
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Verify CLI Tools & Syntax
        shell: bash
        run: |
          python -m py_compile lib/*.py bin/*.py server/*.py
          python bin/scan.py --help
          python bin/clean.py --help
          python bin/cache.py --help
          python bin/cache.py --list

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm ci

      - name: Test UI and startup
        shell: pwsh
        run: |
          npm run build:ui
          $env:SPACE_TEST_BROWSER = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          node --test tests/test_backend.js tests/test_ui.js

      - name: Build Windows Desktop App
        run: npm run build:win

      - name: Smoke-test packaged app without system Python
        shell: pwsh
        run: |
          $env:SPACE_TEST_PACKAGED_EXE = "$pwd\dist\win-unpacked\Space Explorer.exe"
          node --test tests/test_packaged.js

      - name: Verify Windows Build Output
        shell: bash
        run: |
          echo "Listing dist/ contents:"
          ls -la dist/
          find dist -maxdepth 2 -type f \( -name "*.exe" -o -name "*.zip" \)

      - name: Upload Windows App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: space-explorer-windows-app
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS ${{ matrix.arch }} Application
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build:mac:${{ matrix.arch }}
      - name: Smoke-test packaged app without system Python
        shell: bash
        run: |
          export SPACE_TEST_PACKAGED_EXE="$(find "$PWD/dist" -path '*/Contents/MacOS/Space Explorer' -type f -print -quit)"
          test -n "$SPACE_TEST_PACKAGED_EXE"
          node --test tests/test_packaged.js
      - uses: actions/upload-artifact@v4
        with:
          name: space-explorer-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
