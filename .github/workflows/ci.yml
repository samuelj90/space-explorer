name: CI & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit Tests
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Verify CLI Tools & Syntax
        shell: bash
        run: |
          python -m py_compile lib/*.py bin/*.py server/*.py
          python bin/scan.py --help
          python bin/clean.py --help
          python bin/cache.py --help
          python bin/cache.py --list

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Windows Desktop App
        run: npm run build:win

      - name: Verify Windows Build Output
        shell: bash
        run: |
          echo "Listing dist/ contents:"
          ls -la dist/
          find dist -maxdepth 2 -type f \( -name "*.exe" -o -name "*.zip" \)

      - name: Upload Windows App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: space-explorer-windows-app
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
