name: Release & Distribute

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Application Release Asset
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Windows Desktop App
        run: npm run build:win

      - name: Upload Windows Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Release Archives
        run: |
          mkdir -p dist
          tar --exclude='.git' --exclude='.github' --exclude='__pycache__' --exclude='*.pyc' -czf dist/space-explorer-${{ github.ref_name || inputs.tag }}.tar.gz .
          zip -r -q dist/space-explorer-${{ github.ref_name || inputs.tag }}.zip . -x '*.git*' '*.github*' '*__pycache__*' '*.pyc*'

      - name: Download Windows Release Assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist

      - name: List Release Files
        run: |
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Space Explorer ${{ github.ref_name || inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/space-explorer-*.tar.gz
            dist/space-explorer-*.zip
            dist/*.exe
            dist/*.zip
