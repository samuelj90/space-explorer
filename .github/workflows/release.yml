name: Release & Distribute

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Release Archives
        run: |
          mkdir -p dist
          tar --exclude='.git' --exclude='.github' --exclude='__pycache__' --exclude='*.pyc' -czf dist/space-explorer-${{ github.ref_name || inputs.tag }}.tar.gz .
          zip -r -q dist/space-explorer-${{ github.ref_name || inputs.tag }}.zip . -x '*.git*' '*.github*' '*__pycache__*' '*.pyc*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Space Explorer ${{ github.ref_name || inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/space-explorer-*.tar.gz
            dist/space-explorer-*.zip
